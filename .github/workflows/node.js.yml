name: Node.js CI

on:
  push:
    branches: [ "v3.0.x-release" ]
  pull_request:
    branches: [ "v3.0.x-release" ]

jobs:
  build:
    runs-on: bigblue

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Run dev script in bigbluebutton-html
        run: |
          cd bigbluebutton-html
          sudo ./run-dev.sh
